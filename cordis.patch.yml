# Patch layer contributed by dsh-plugin-discord.
#
# Adds one host-side row to the web profile: the Discord bridge. Everything
# else in the bundle is inherited untouched. Configure the bridge by patching
# this row's config in the profile's own cordis.patch.yml, e.g.
#
#   - id: discord-bridge
#     config:
#       allowedUsers: ["<your discord user id>"]
#       cwd: /Users/you/projects
#
# Token: export DSH_DISCORD_TOKEN in the dsh process environment (or set
# config.token / config.tokenFile).
- insert:
    - id: discord-bridge
      name: dsh-plugin-discord
